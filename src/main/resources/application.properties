# Spring Boot default port 8080
# Add custom configuration here if needed

# PostgreSQL Database Configuration
# Railway provides these via environment variables automatically
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:5432/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Application
spring.application.name=todo-app
